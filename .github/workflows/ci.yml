# Windows · Linux · macOS 에서 다섯 가지를 확인한다:
#   1. pytest  2. ruff  3. 화면 빌드  4. 서버 0대로 띄워 API 응답  5. 플러그인 훅이 예시 입력을 받아 오류 없이 끝남
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # 윈도우는 Git Bash — 훅도 Claude Code 가 Git Bash 로 돌린다
    env:
      PYTHONIOENCODING: utf-8
      DEVDASH_HOME: ${{ github.workspace }}/../devdash-home # 저장소 밖 임시 상태 폴더
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # 요구하는 가장 낮은 버전

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: 백엔드 설치
        run: python -m pip install --quiet -e "src/backend[dev]"

      - name: ruff
        working-directory: src/backend
        run: |
          python -m ruff check . ../../plugins/devdash/scripts
          python -m ruff format --check . ../../plugins/devdash/scripts

      - name: pytest
        working-directory: src/backend
        run: python -m pytest -q

      - name: 화면 빌드
        working-directory: src/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 서버 0대로 띄워 API 가 답하는지
        run: |
          python -m devdash serve --port 8775 > serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8775/api/servers > servers.json && break
            sleep 1
          done
          cat servers.json; echo
          test "$(cat servers.json)" = "[]"
          curl -sf http://127.0.0.1:8775/api/pc/memory | head -c 200; echo
          curl -sf http://127.0.0.1:8775/api/pc/abilities; echo
          curl -sf http://127.0.0.1:8775/ | grep -q '<title>Dev Dashboard</title>'
          kill %1 || true

      - name: 플러그인 훅이 예시 입력을 받아 오류 없이 끝나는지
        run: |
          run="$GITHUB_WORKSPACE/plugins/devdash/scripts/run.sh"
          proj="$RUNNER_TEMP/hook-proj"
          mkdir -p "$proj/src" && cd "$proj"
          printf 'a\n' > src/a.py
          git init -q && git add . && git -c user.name=ci -c user.email=ci@ci commit -qm init
          sh "$run" devdash_store.py register "$proj" "" || exit 1
          hook() {
            echo "$2" | sh "$run" devdash_hook.py "$1" || { echo "$1 실패"; exit 1; }
          }
          # 윈도우(Git Bash)의 pwd 는 /d/a/… 꼴이라 파이썬이 못 읽는다 — 훅 입력에는 D:/a/… 꼴로
          here=$(pwd -W 2>/dev/null || pwd)
          home=$(cygpath -u "$DEVDASH_HOME" 2>/dev/null || echo "$DEVDASH_HOME")
          base="\"session_id\":\"s1\",\"cwd\":\"$here\",\"prompt_id\":\"p1\""
          edit="\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"$here/src/a.py\"}"
          bash_="\"tool_name\":\"Bash\",\"tool_use_id\":\"t1\",\"tool_input\":{\"command\":\"python fix.py\"}"
          hook UserPromptSubmit "{$base,\"session_title\":\"ci\"}"
          hook PreToolUse "{$base,$edit}"
          printf 'a\nb\n' > src/a.py
          hook PostToolUse "{$base,$edit,\"tool_response\":{}}"
          hook PreToolUse "{$base,$bash_}"
          printf 'a\nc\n' > src/a.py
          hook PostToolUse "{$base,$bash_,\"tool_response\":{}}"
          hook Stop "{$base}"
          if [ -f "$home/hook-errors.log" ]; then cat "$home/hook-errors.log"; exit 1; fi
          snaps=$(cat "$home"/projects/*/snapshots.jsonl | wc -l)
          echo "스냅샷 $snaps 줄"
          test "$snaps" -ge 3
